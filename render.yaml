# Render 배포 설정 (https://render.com)
# 무료 플랜은 서버가 재시작될 때마다 데이터(회원·공고)가 초기화됩니다. 체험용으로만 쓰세요.
# 실제 운영 시: plan을 starter로 바꾸고 아래 disk와 DB_PATH의 주석을 푸세요.
services:
  - type: web
    name: ilgam
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      # - key: DB_PATH
      #   value: /var/data/ilgam.db
