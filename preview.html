<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>쉼표 - 걸어 다니며 수다 떠는 3D 광장</title>
<meta name="description" content="쉬는 시간에 들르는 3D 광장. 아바타를 만들어 카페, 라운지, PC방, 포장마차, 스터디룸, 루프탑을 돌아다니며 이야기해요.">
<meta name="theme-color" content="#14161c">
<style>
:root { --accent: #5b6cf0; --card: #1c1f27; --text: #eef0f5; --muted: #a2a9b8; --line: #323745; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: #0d0f14; color: var(--text); overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard, "Malgun Gothic", "Noto Sans KR", sans-serif;
  font-size: 15px; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere;
  overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
input { font-family: inherit; }
button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; font-size: 16px; }

/* ---------- 입장 화면 ---------- */
#entry {
  position: fixed; inset: 0; z-index: 30; overflow-y: auto; padding: 16px;
  background: radial-gradient(1200px 700px at 30% 20%, #27305a, #0d0f14 70%);
  display: flex; align-items: flex-start; justify-content: center;
}
.entry-card {
  width: 100%; max-width: 760px; margin: auto 0; background: var(--card); border: 1px solid var(--line);
  border-radius: 22px; padding: 20px; display: grid; grid-template-columns: 1fr 1.15fr; gap: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.entry-left { text-align: center; display: flex; flex-direction: column; min-width: 0; }
.entry-card h1 { margin: 0; font-size: 36px; letter-spacing: -1px; }
.entry-card h1 span { color: var(--accent); }
.tagline { margin: 2px 0 8px; color: var(--muted); }
#preview { width: 100%; flex: 1; min-height: 260px; border-radius: 16px; background: linear-gradient(#2a3150, #171a24); display: block; }
#entryForm label, .pick-label { display: block; font-weight: 700; font-size: 13px; margin: 10px 0 6px; color: var(--muted); }
#entryForm label { margin-top: 0; }
#nameInput, #chatInput {
  width: 100%; padding: 12px; font-size: 16px; border: 1.5px solid var(--line); border-radius: 12px;
  background: #12141a; color: var(--text);
}
#nameInput:focus, #chatInput:focus { outline: 2px solid var(--accent); border-color: transparent; }
.picks { display: flex; flex-wrap: wrap; gap: 7px; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; padding: 0; box-shadow: 0 0 0 1px var(--line); }
.swatch.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
.opt { padding: 7px 11px; border-radius: 10px; border: 1.5px solid var(--line); background: #12141a; font-size: 14px; }
.opt.on { border-color: var(--accent); background: #262c52; }
#enterBtn { width: 100%; margin-top: 16px; }
.fine { color: var(--muted); font-size: 12px; margin: 10px 0 0; text-align: center; }
@media (max-width: 640px) {
  .entry-card { grid-template-columns: 1fr; gap: 10px; padding: 16px; }
  #preview { min-height: 200px; height: 200px; flex: none; }
  .entry-card h1 { font-size: 30px; }
}

/* ---------- 3D 공간 ---------- */
#game { position: fixed; inset: 0; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.tag, .bubble, .door-label { position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap; }
.tag {
  padding: 2px 9px; border-radius: 99px; font-size: 13px; font-weight: 700;
  background: rgba(15, 17, 23, 0.62); color: #fff; backdrop-filter: blur(4px);
}
.tag.me { background: rgba(91, 108, 240, 0.92); }
.tag.npc { background: rgba(255, 255, 255, 0.85); color: #1c1f27; }
.bubble {
  max-width: 230px; white-space: normal; padding: 7px 11px; border-radius: 14px; font-size: 14px;
  background: #fff; color: #1c1f27; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35); transition: opacity 0.3s;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px;
  border: 6px solid transparent; border-top-color: #fff; border-bottom: 0;
}
.door-label {
  padding: 5px 12px; border-radius: 10px; font-size: 13px; font-weight: 800; text-align: center;
  background: rgba(15, 17, 23, 0.78); color: #fff; border: 1px solid rgba(255, 255, 255, 0.25);
}
.door-label small { display: block; font-weight: 500; font-size: 11px; color: #c9d0e0; }

#top {
  position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 8px;
  padding: calc(8px + env(safe-area-inset-top)) 10px 18px;
  background: linear-gradient(rgba(8, 9, 13, 0.75), transparent); pointer-events: none;
}
#top button {
  pointer-events: auto; border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(20, 22, 30, 0.7); color: #fff;
  border-radius: 10px; padding: 8px 12px; font-weight: 700; white-space: nowrap; backdrop-filter: blur(6px);
}
#roomInfo { flex: 1; min-width: 0; text-align: center; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); }
#roomTitle { display: block; font-size: 17px; }
#roomTopic { display: block; font-size: 13px; color: #dfe4f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#status, #hint {
  position: absolute; left: 50%; transform: translateX(-50%); max-width: 92%; text-align: center;
  background: rgba(15, 17, 23, 0.85); color: #fff; padding: 8px 16px; border-radius: 99px; font-size: 13px; font-weight: 600;
}
#status { top: 84px; }
#hint { top: 84px; transition: opacity 0.6s; pointer-events: none; }
#hint.gone { opacity: 0; }

#chat {
  position: absolute; left: 0; bottom: 0; width: 100%; max-width: 440px;
  padding: 0 10px calc(10px + env(safe-area-inset-bottom)); pointer-events: none;
}
#log {
  max-height: 30vh; overflow-y: auto; padding: 30px 4px 8px; pointer-events: auto;
  -webkit-mask-image: linear-gradient(transparent, #000 34px); mask-image: linear-gradient(transparent, #000 34px);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 8px rgba(0, 0, 0, 0.7); scrollbar-width: none;
}
#log::-webkit-scrollbar { display: none; }
.msg { margin: 3px 0; }
.msg.old { opacity: 0.6; }
.who { border: 0; background: none; padding: 0; margin-right: 6px; font-weight: 800; color: #9fb0ff; text-shadow: inherit; }
.who.me { color: #fff; cursor: default; }
.sys { color: #c8cedb; font-size: 13px; margin: 3px 0; }
#chatForm { display: flex; gap: 8px; pointer-events: auto; }
#chatInput { background: rgba(18, 20, 26, 0.85); backdrop-filter: blur(6px); }
#chatForm .primary { padding: 10px 16px; white-space: nowrap; }

/* ---------- 겹쳐 뜨는 창 ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(5, 6, 10, 0.6); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 520px; max-height: 86dvh; overflow-y: auto; background: var(--card);
  border-radius: 20px 20px 0 0; padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); border: 1px solid var(--line);
}
@media (min-width: 700px) { .overlay { align-items: center; } .sheet { border-radius: 20px; } }
.sheet h2 { margin: 0; font-size: 18px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sheet-head button { border: 0; background: none; font-size: 18px; padding: 4px 8px; }
.room-card {
  display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 11px 12px;
  background: #12141a; border: 1px solid var(--line); border-radius: 12px;
}
.room-card.here { border-color: var(--accent); background: #1d2140; }
.rc-head { display: flex; align-items: center; gap: 8px; }
.rc-head b { font-size: 16px; }
.chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #2a2f45; color: #c9d0ff; }
.rc-count { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.rc-desc { font-size: 13px; color: var(--muted); margin-top: 4px; }
.ad-slot { margin-top: 6px; min-height: 60px; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 12px; }
.sheet.small { max-width: 340px; display: flex; flex-direction: column; gap: 8px; text-align: center; }
.sheet.small button { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: #12141a; font-weight: 600; }
</style>
</head>
<body>

<!-- 입장 화면: 닉네임과 아바타 꾸미기 -->
<section id="entry">
  <div class="entry-card">
    <div class="entry-left">
      <h1>쉼표<span>,</span></h1>
      <p class="tagline">쉬는 시간에 들르는 3D 광장</p>
      <canvas id="preview" aria-label="내 아바타 미리보기"></canvas>
    </div>
    <form id="entryForm">
      <label for="nameInput">닉네임</label>
      <input id="nameInput" maxlength="10" autocomplete="off" placeholder="최대 10자" required>
      <div class="pick-label">피부</div><div class="picks" id="skinPicks"></div>
      <div class="pick-label">머리 모양</div><div class="picks" id="hairPicks"></div>
      <div class="pick-label">머리 색</div><div class="picks" id="hairColorPicks"></div>
      <div class="pick-label">상의</div><div class="picks" id="topPicks"></div>
      <div class="pick-label">하의</div><div class="picks" id="bottomPicks"></div>
      <button class="primary" id="enterBtn">입장하기</button>
      <p class="fine">회원가입 없이 바로 들어가요. 닉네임과 채팅은 다른 사람에게 보입니다.</p>
    </form>
  </div>
</section>

<!-- 3D 공간 -->
<section id="game" hidden>
  <canvas id="world"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header id="top">
    <button id="roomsBtn" type="button">방 목록</button>
    <div id="roomInfo"><b id="roomTitle"></b><span id="roomTopic"></span></div>
    <button id="editBtn" type="button">내 아바타</button>
  </header>

  <div id="status" hidden></div>
  <div id="hint">화면을 누르면 그곳으로 걸어가요 · 드래그하면 시점이 돌아가요</div>

  <div id="chat">
    <div id="log" aria-live="polite"></div>
    <form id="chatForm">
      <input id="chatInput" maxlength="80" autocomplete="off" placeholder="메시지 입력" enterkeyhint="send">
      <button class="primary">전송</button>
    </form>
  </div>
</section>

<!-- 방 목록 -->
<div id="roomsPanel" class="overlay" hidden>
  <div class="sheet">
    <div class="sheet-head"><h2>어디로 갈까요?</h2><button type="button" id="roomsClose" aria-label="닫기">✕</button></div>
    <div id="roomCards"></div>
    <div class="ad-slot">광고 영역</div>
  </div>
</div>

<!-- 채팅 상대 메뉴 -->
<div id="userMenu" class="overlay" hidden>
  <div class="sheet small">
    <h2 id="userMenuName"></h2>
    <button type="button" id="blockBtn">이 사람 채팅 숨기기</button>
    <button type="button" id="reportBtn">신고하기</button>
    <button type="button" id="userMenuClose">닫기</button>
  </div>
</div>
